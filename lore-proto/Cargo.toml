[package]
name = "lore-proto"
# Crate version is used for proto-artifactory workflow
version = "0.1.64"
edition = "2024"
publish = false

[lib]
# The generated bindings hold no unit tests; the suites in tests/ are their own
# targets. Set this back to build a harness for unit tests.
test = false

[features]
default = ["native-conversions"]
# Native in-process callers retain the existing model conversion impls. Wire-only
# consumers can use the generated API without linking the native runtime.
native-conversions = ["dep:lore-base"]

[dependencies]
lore-base = { workspace = true, optional = true }
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
